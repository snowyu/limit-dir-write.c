# limit-dir 默认配置 —— ⚠ 设计草案，功能尚未实现：
# 当前 limit-dir.c 不读取任何配置文件，Makefile 也不安装本文件。
# 保留此处是为了记录拟支持的配置格式，实现时以本文件的语法为准；
# 实现后由 make install 安装至 /etc/limit-dir/rules.conf。
#
# 语法:
#   [rw]     每行一个可写目录（--strict 时本节整体忽略）
#   [device] 每行 "r|rw 路径"（前缀可选，默认 rw；不受 --strict
#            影响；在内置设备集之上追加，不能移除内置项）
# 支持 ~、$VAR、${VAR}、$UID 展开；未定义变量的行跳过并警告；
# 路径不存在时静默跳过。
# 用户级配置: ~/.config/limit-dir/rules.conf（与本文件追加合并）
# 项目级配置: ./.limit-dir.conf（注意: 在不可信目录中运行时该文件
#            可能被他人预置以放宽沙箱，详见 README）

[rw]
/tmp
/var/tmp
~/.cache
~/.config
~/.local
~/.gnupg
/dev/shm
# XDG 运行时目录如何表现，这个是动态的
